id: local-pilot-t3-tool-continuation
version: 1
description: "T3 tool-result continuation — must RUN gen.mjs and use its stdout to produce out.txt."
repo: ../../fixtures/tool-continuation
branch: main
prompt: |
  Run the command `node gen.mjs`. It prints a single token line to stdout.
  Write that exact token (the full line, no extra whitespace) into a new file out.txt.
  You cannot know the token without running the script.
context: { strategy: default, maxFiles: 10, includeTests: true }
sandbox: { type: native, network: none, timeout: 300 }
agent:
  permissions: bypassPermissions
  maxTurns: 8
  maxTokens: 8192
  tools: { allow: [read_file, write_file, run_shell], deny: [] }
checks:
  fail_to_pass:
    - { id: out-has-token, command: "grep -qx TOKEN-7F3A9C out.txt", timeout: 20, weight: 1.0 }
  pass_to_pass:
    - { id: gen-exists, command: "test -f gen.mjs", timeout: 20, weight: 0.0 }
tags: [javascript, tool-result, local-pilot, easy]
difficulty: easy
expectedPatchScope: [out.txt]
expectedMaxLines: 2
