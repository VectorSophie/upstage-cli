id: local-pilot-t2-tool-select
version: 1
description: "T2 tool-selection — one of two functions is wrong; the agent must inspect to pick the right fix."
repo: ../../fixtures/tool-select
branch: main
prompt: |
  Exactly one function in math.mjs is implemented incorrectly; the other is correct.
  Inspect the file, fix only the incorrect function, and leave the correct one unchanged.
  Do not modify the test file.
context: { strategy: default, maxFiles: 10, includeTests: true }
sandbox: { type: native, network: none, timeout: 300 }
agent:
  permissions: acceptEdits
  maxTurns: 8
  maxTokens: 8192
  tools: { allow: [read_file, write_file, search_code, repo_map], deny: [] }
checks:
  fail_to_pass:
    - { id: test-mul, command: node --test --test-name-pattern test_mul math.test.mjs, timeout: 30, weight: 0.8 }
  pass_to_pass:
    - { id: test-add, command: node --test --test-name-pattern test_add math.test.mjs, timeout: 30, weight: 0.2 }
tags: [javascript, tool-selection, local-pilot, easy]
difficulty: easy
expectedPatchScope: [math.mjs]
expectedMaxLines: 3
