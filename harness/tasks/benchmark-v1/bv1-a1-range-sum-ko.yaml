_import: ./_base-benchmark-v1.yaml
id: bv1-a1-range-sum-ko
description: "simple-repair (Korean prompt) — off-by-one in rangeSum"
repo: ../../fixtures/benchmark-v1/a1-range-sum
prompt: |
  src.mjs의 rangeSum(n) 함수는 1부터 n까지(n 포함)의 합을 반환해야 하지만 off-by-one 버그가 있습니다.
  app.test.mjs의 테스트가 통과하도록 src.mjs를 수정하세요. 테스트 파일은 수정하지 마세요.
checks:
  fail_to_pass:
    - { id: fix, command: 'node --test --test-name-pattern "^fix_" app.test.mjs', timeout: 40 }
  pass_to_pass:
    - { id: sanity, command: 'node --test --test-name-pattern "^sanity_" sanity.test.mjs', timeout: 40, weight: 0.0 }
tags: [benchmark-v1, category-a, korean]
difficulty: easy
language: ko
expectedPatchScope: [src.mjs]
expectedMaxLines: 20
# Scored test files; restored from the pristine fixture after the agent
# runs, so editing/renaming/weakening them cannot change the grade.
trustedPaths: [app.test.mjs, sanity.test.mjs]
