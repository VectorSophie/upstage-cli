_import: ./_base-benchmark-v1.yaml
id: bv1-c1-one-wrong-op
description: "category-c — tool-selection"
repo: ../../fixtures/benchmark-v1/c1-one-wrong-op
prompt: |
  Exactly one of add/sub/mul in math.mjs is implemented incorrectly; the others are correct and
  must stay correct. Find and fix only the wrong one so app.test.mjs passes and the sanity checks
  still pass. Do not edit the test files or unrelated files.
checks:
  fail_to_pass:
    - { id: fix, command: 'node --test --test-name-pattern "^fix_" app.test.mjs', timeout: 40 }
  pass_to_pass:
    - { id: sanity, command: 'node --test --test-name-pattern "^sanity_" sanity.test.mjs', timeout: 40, weight: 0.0 }
tags: [benchmark-v1, category-c]
difficulty: easy
language: en
expectedPatchScope: [math.mjs]
expectedMaxLines: 20
