_import: ./_base-benchmark-v1-dataset.yaml
id: bv1-dx2-route-normalize
description: "benchmark-v1 dataset — B (medium)"
repo: ../../fixtures/benchmark-v1/dx2-route-normalize
prompt: |
  route(path) should match a registered route regardless of a trailing slash or letter case, but route('/users/') returns 'not found' instead of the '/users' handler. Make app.test.mjs pass. Do not edit the test files.
checks:
  fail_to_pass:
    - { id: fix, command: 'node --test --test-name-pattern "^fix_" app.test.mjs', timeout: 60 }
  pass_to_pass:
    - { id: sanity, command: 'node --test --test-name-pattern "^sanity_" sanity.test.mjs', timeout: 60, weight: 0.0 }
# Scored test files; restored from the pristine fixture after the agent runs so
# editing/renaming/weakening them cannot change the grade.
trustedPaths: [app.test.mjs, sanity.test.mjs]
tags: [benchmark-v1, benchmark-v1-dataset, category-b]
difficulty: medium
language: en
expectedPatchScope: [path.mjs]
expectedMaxLines: 25
