_import: ./_base-benchmark-v1.yaml
id: bv1-c2-trivial-constant
description: "category-c — tool-selection"
repo: ../../fixtures/benchmark-v1/c2-trivial-constant
prompt: |
  PAGE_SIZE in config.mjs must be 10. Fix it so app.test.mjs passes. This needs only a one-line
  edit; do not run unnecessary commands. Do not edit the test files.
checks:
  fail_to_pass:
    - { id: fix, command: 'node --test --test-name-pattern "^fix_" app.test.mjs', timeout: 40 }
  pass_to_pass:
    - { id: sanity, command: 'node --test --test-name-pattern "^sanity_" sanity.test.mjs', timeout: 40, weight: 0.0 }
tags: [benchmark-v1, category-c]
difficulty: easy
language: en
expectedPatchScope: [config.mjs]
expectedMaxLines: 20
# Scored test files; restored from the pristine fixture after the agent
# runs, so editing/renaming/weakening them cannot change the grade.
trustedPaths: [app.test.mjs, sanity.test.mjs]
