_import: ./_base-benchmark-v1.yaml
id: bv1-f1-csv-two-bugs
description: "category-f — multi-step"
repo: ../../fixtures/benchmark-v1/f1-csv-two-bugs
prompt: |
  parseLine(line) in csv.mjs must split a CSV line on commas AND trim each field. It currently
  has two defects. Fix both so app.test.mjs passes, then confirm the sanity check still passes.
  Do not edit the test files.
checks:
  fail_to_pass:
    - { id: fix, command: 'node --test --test-name-pattern "^fix_" app.test.mjs', timeout: 40 }
  pass_to_pass:
    - { id: sanity, command: 'node --test --test-name-pattern "^sanity_" sanity.test.mjs', timeout: 40, weight: 0.0 }
tags: [benchmark-v1, category-f]
difficulty: medium
language: en
expectedPatchScope: [csv.mjs]
expectedMaxLines: 20
