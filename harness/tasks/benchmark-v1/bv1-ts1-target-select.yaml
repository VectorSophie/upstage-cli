_import: ./_base-benchmark-v1-dataset.yaml
id: bv1-ts1-target-select
description: "benchmark-v1 dataset — C (medium)"
repo: ../../fixtures/benchmark-v1/ts1-target-select
prompt: |
  maxRetries() must return 4 but returns 1. This repository contains more than one settings module; change the one that is actually used so the test passes, without editing unrelated files. Do not edit the test files.
checks:
  fail_to_pass:
    - { id: fix, command: 'node --test --test-name-pattern "^fix_" app.test.mjs', timeout: 60 }
  pass_to_pass:
    - { id: sanity, command: 'node --test --test-name-pattern "^sanity_" sanity.test.mjs', timeout: 60, weight: 0.0 }
# Scored test files; restored from the pristine fixture after the agent runs so
# editing/renaming/weakening them cannot change the grade.
trustedPaths: [app.test.mjs, sanity.test.mjs]
tags: [benchmark-v1, benchmark-v1-dataset, category-c]
difficulty: medium
language: en
expectedPatchScope: [settings.mjs]
expectedMaxLines: 25
