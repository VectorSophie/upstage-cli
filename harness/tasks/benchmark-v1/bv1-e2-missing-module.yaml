_import: ./_base-benchmark-v1.yaml
id: bv1-e2-missing-module
description: "category-e — failure-recovery"
repo: ../../fixtures/benchmark-v1/e2-missing-module
prompt: |
  app.test.mjs imports ./slug.mjs, which does not exist, so the test errors. Create slug.mjs
  exporting slugify(s) that lowercases, trims, and replaces runs of whitespace with single
  hyphens, so app.test.mjs passes. Do not edit the test files.
checks:
  fail_to_pass:
    - { id: fix, command: 'node --test --test-name-pattern "^fix_" app.test.mjs', timeout: 40 }
  pass_to_pass:
    - { id: sanity, command: 'node --test --test-name-pattern "^sanity_" sanity.test.mjs', timeout: 40, weight: 0.0 }
tags: [benchmark-v1, category-e]
difficulty: medium
language: en
expectedPatchScope: [slug.mjs]
expectedMaxLines: 20
# Scored test files; restored from the pristine fixture after the agent
# runs, so editing/renaming/weakening them cannot change the grade.
trustedPaths: [app.test.mjs, sanity.test.mjs]
