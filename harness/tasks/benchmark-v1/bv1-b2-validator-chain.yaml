_import: ./_base-benchmark-v1.yaml
id: bv1-b2-validator-chain
description: "category-b — multi-file-repair"
repo: ../../fixtures/benchmark-v1/b2-validator-chain
prompt: |
  check(n) (validate.mjs) returns "ok" for positive numbers and "bad" otherwise, but it wrongly
  treats zero as positive. The defect is in the rule it depends on. Fix the code so app.test.mjs
  passes. Do not edit the test files.
checks:
  fail_to_pass:
    - { id: fix, command: 'node --test --test-name-pattern "^fix_" app.test.mjs', timeout: 40 }
  pass_to_pass:
    - { id: sanity, command: 'node --test --test-name-pattern "^sanity_" sanity.test.mjs', timeout: 40, weight: 0.0 }
tags: [benchmark-v1, category-b]
difficulty: medium
language: en
expectedPatchScope: [rules.mjs]
expectedMaxLines: 20
# Scored test files; restored from the pristine fixture after the agent
# runs, so editing/renaming/weakening them cannot change the grade.
trustedPaths: [app.test.mjs, sanity.test.mjs]
