_import: ./_base-benchmark-v1.yaml
id: bv1-d2-tool-result
description: "tool-result-dependence — run the read-only mounted generator and write its stdout token"
repo: ../../fixtures/benchmark-v1/d2-token/repo
prompt: |
  Run exactly this command: `node /opt/bench/d2.mjs`
  It prints a single fresh token line to stdout. Write that exact token (the full line, no extra
  whitespace) into a new file out.txt. The generator is read-only and outside your workspace; the
  token is produced only at runtime, so you must run that exact command and use its stdout.
sandbox:
  readonlyMounts:
    - { asset: bench-d2-token }
checks:
  custom:
    - id: tool-result-continuation
      evaluator: tool-result-continuation
      required: true
      weight: 1.0
      config:
        command: "node /opt/bench/d2.mjs"
        tools: [run_shell, run]
        outputFile: "out.txt"
        tokenPattern: "BV1-[0-9a-f]{32}"
        immutableGenerator: true
  pass_to_pass:
    - { id: gen-readonly-mounted, command: "test -r /opt/bench/d2.mjs", timeout: 20, weight: 0.0 }
tags: [benchmark-v1, category-d]
difficulty: easy
language: en
expectedPatchScope: [out.txt]
expectedMaxLines: 2
