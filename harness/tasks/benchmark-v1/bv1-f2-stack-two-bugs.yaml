_import: ./_base-benchmark-v1.yaml
id: bv1-f2-stack-two-bugs
description: "category-f — multi-step"
repo: ../../fixtures/benchmark-v1/f2-stack-two-bugs
prompt: |
  The Stack class in stack.mjs has two defects: pop() does not remove the top item and size() is
  off by one. Fix both so app.test.mjs passes (LIFO order and correct size). Do not edit the test files.
checks:
  fail_to_pass:
    - { id: fix, command: 'node --test --test-name-pattern "^fix_" app.test.mjs', timeout: 40 }
  pass_to_pass:
    - { id: sanity, command: 'node --test --test-name-pattern "^sanity_" sanity.test.mjs', timeout: 40, weight: 0.0 }
tags: [benchmark-v1, category-f]
difficulty: medium
language: en
expectedPatchScope: [stack.mjs]
expectedMaxLines: 20
# Scored test files; restored from the pristine fixture after the agent
# runs, so editing/renaming/weakening them cannot change the grade.
trustedPaths: [app.test.mjs, sanity.test.mjs]
