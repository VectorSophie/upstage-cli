# Shared envelope for benchmark v1 candidate tasks. Not a task itself (leading
# underscore → skipped by loadTaskDir). Children _import this and add
# id/repo/prompt/checks/etc. Budgets are Track A (common-resource) defaults; see
# docs/BENCHMARK_V1_PROTOCOL.md. Do not tune per task after seeing results.
version: 1
branch: main
context: { strategy: default, maxFiles: 10, includeTests: true }
sandbox:
  type: docker
  # Pinned by digest (Phase 8 reproducibility); node:22-alpine as of 2026-10.
  image: node:22-alpine@sha256:fe4f6d74e20370acb04ad889077d14d0f64a9c8ea6a42bc60cddf1e844699914
  network: none
  # Per-exec (Docker) wall-clock for each tool call / check. Raised from 120 to
  # 300 so a slow reasoning model's single tool call is not truncated by the
  # container clock (EXAONE pilots ran 60–165 s/task). The AGENT's total budget
  # is bounded by maxTurns × maxTokens, not this per-exec limit; the exact total
  # agent wall-clock is a pre-freeze decision (see BENCHMARK_V1_SEMANTIC_AUDIT.md
  # §Budget). Fast checks still finish in well under a second.
  timeout: 300
agent:
  permissions: bypassPermissions
  maxTurns: 10
  # Track A (common-resource) OUTPUT cap. 4096, NOT 8192: Solar is validated only
  # to an 8192-token TOTAL context (prompt + tools + history + output), so an
  # 8192 output cap leaves no room for input and the server 400s. 4096 is the
  # largest output that is simultaneously feasible across all four models within
  # the 8192 common ceiling (it is also A.X's / EXAONE-no-think's validated
  # output limit). Kanana/EXAONE-thinking can emit 8192 natively — that extra
  # headroom is a Track B (model-native) setting, never Track A.
  maxTokens: 4096
  tools: { allow: [read_file, write_file, run_shell], deny: [] }
