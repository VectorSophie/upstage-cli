_import: ./_base-benchmark-v1-dataset.yaml
id: bv1-fr1-crash-recover-ko
description: "benchmark-v1 dataset — E (medium)"
repo: ../../fixtures/benchmark-v1/fr1-crash-recover
prompt: |
  names(RECORDS) 호출이 현재 예외를 던집니다. 각 레코드의 사용자 이름을 반환해야 하며, 사용자 이름이 없는 레코드는 'anonymous'로 처리해야 합니다. app.test.mjs가 통과하도록 수정하세요. 테스트 파일은 수정하지 마세요.
checks:
  fail_to_pass:
    - { id: fix, command: 'node --test --test-name-pattern "^fix_" app.test.mjs', timeout: 60 }
  pass_to_pass:
    - { id: sanity, command: 'node --test --test-name-pattern "^sanity_" sanity.test.mjs', timeout: 60, weight: 0.0 }
# Scored test files; restored from the pristine fixture after the agent runs so
# editing/renaming/weakening them cannot change the grade.
trustedPaths: [app.test.mjs, sanity.test.mjs]
tags: [benchmark-v1, benchmark-v1-dataset, category-e, korean]
difficulty: medium
language: ko
expectedPatchScope: [extract.mjs]
expectedMaxLines: 25
