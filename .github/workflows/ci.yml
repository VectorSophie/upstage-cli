name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # The CLI itself runs on Bun (the TUI's native renderer requires it —
      # see docs/superpowers specs plan); business-logic tests/lint/check
      # still run on Node, since they have no Bun/OpenTUI dependency.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Syntax check
        run: node --check src/cli/index.mjs

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: TUI render test (Bun)
        run: npm run test:ui

      - name: Smoke test
        run: npm run smoke
        env:
          UPSTAGE_API_KEY: ""

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-node-${{ matrix.node }}
          path: coverage/
          retention-days: 7
