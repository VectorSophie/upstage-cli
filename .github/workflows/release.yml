name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate
        run: npm run ci

      - name: Validate package
        run: npm pack --dry-run

  # One real runner per target platform/arch, not a cross-compile matrix from
  # a single host — @opentui/core's native rendering core ships a separate
  # prebuilt addon per OS/arch as an optionalDependency, resolved dynamically
  # at runtime; `bun install` only ever fetches the one matching the CURRENT
  # host, so only a same-platform build can resolve it (see
  # scripts/package-binary.mjs's top comment for the full explanation).
  build-binaries:
    name: Build ${{ matrix.name }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
          - os: ubuntu-24.04-arm
            name: linux-arm64
          # macos-13 (Intel) was retired Dec 2025; macos-15-intel is the
          # current (and per GitHub, final) x64 macOS runner image.
          - os: macos-15-intel
            name: darwin-x64
          - os: macos-15
            name: darwin-arm64
          - os: windows-latest
            name: windows-x64
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and package
        run: bun scripts/package-binary.mjs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: upstage-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    name: Release ${{ github.ref_name }}
    needs: [validate, build-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all platform binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "upstage-*"
          merge-multiple: true

      - name: Extract changelog entry
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(awk "/^## \[${VERSION}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md)
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const release = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: context.ref.replace('refs/tags/', ''),
              name: context.ref.replace('refs/tags/', ''),
              body: `${{ steps.changelog.outputs.notes }}`,
              draft: false,
              prerelease: context.ref.includes('-')
            });
            for (const file of fs.readdirSync("dist")) {
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.data.id,
                name: file,
                data: fs.readFileSync(path.join("dist", file))
              });
            }
